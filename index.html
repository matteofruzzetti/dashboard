function bin(s){var x=atob(s),u=new Uint8Array(x.length);for(var i=0;i<x.length;i++)u[i]=x.charCodeAt(i);return u;}
function b64(buf){var u=new Uint8Array(buf),s='';for(var i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s);}
var mem=null;try{mem=window.localStorage;mem.getItem(K);}catch(x){mem=null;}
try{q.textContent='Dati aggiornati il '+new Date(C.quando).toLocaleString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});}catch(x){}
if(!window.crypto||!crypto.subtle||typeof DecompressionStream!=='function'||typeof TextEncoder!=='function'){
e.textContent='Questo browser non può aprire la pagina: aggiorna Chrome, Safari, Edge o Firefox.';b.disabled=true;return;}
function deriva(pwd){return crypto.subtle.importKey('raw',new TextEncoder().encode(pwd.normalize('NFC')),'PBKDF2',false,['deriveBits'])
.then(function(k){return crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:bin(C.sale),iterations:C.iter},k,256);});}
function decifra(raw){return crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt'])
.then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:bin(C.iv)},k,bin(C.dati));})
.then(function(pt){return new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).text();});}
function mostra(html){html=html.replace(/<head>/i,'<head><meta name="versione-pagina" content="'+C.quando+'">');
document.open();document.write(html);document.close();}
function attesa(t){b.disabled=true;b.textContent=t;}
function pronto(){b.disabled=false;b.textContent='Apri';}
var ric=null;try{ric=mem&&JSON.parse(mem.getItem(K)||'null');}catch(x){ric=null;}
if(ric&&ric.sale===C.sale&&ric.iter===C.iter&&ric.k){attesa('Apertura…');
decifra(bin(ric.k)).then(mostra,function(){try{mem.removeItem(K);}catch(x){}pronto();e.textContent='Password cambiata: inseriscila di nuovo.';});}
document.getElementById('f').addEventListener('submit',function(ev){ev.preventDefault();e.textContent='';attesa('Verifica…');
var pwd=p.value;deriva(pwd).then(function(raw){return decifra(raw).then(function(html){
if(r.checked&&mem){try{mem.setItem(K,JSON.stringify({sale:C.sale,iter:C.iter,k:b64(raw)}));}catch(x){}}
else if(mem){try{mem.removeItem(K);}catch(x){}}
mostra(html);});}).catch(function(){pronto();e.textContent='Password non corretta.';try{p.select();}catch(x){}});});
})();
</script>
